# Render Blueprint — deploys the backend and scoring service from this repo.
# Render dashboard → New → Blueprint → pick this repo. The frontend stays on Vercel.
services:
  - type: web
    name: easwari-scoring
    runtime: docker
    rootDir: ml-service
    plan: free
    healthCheckPath: /health

  - type: web
    name: easwari-erp-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: local
      - key: JWT_SECRET
        generateValue: true
      - key: ML_BASE_URL
        value: https://easwari-scoring.onrender.com
      # Vercel proxies /api server-side, so this only matters for direct browser calls.
      - key: CORS_ORIGINS
        value: https://easwari-erp.vercel.app
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75
